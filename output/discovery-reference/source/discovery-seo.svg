<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title description"><title id="title">Illustrative search result featuring Structly</title><desc id="description">An original, unbranded search interface for AI readiness checker. Structly is the first visible result. This is an illustrative example, not an observed ranking.</desc><rect width="640" height="440" rx="18" fill="#f6f7f9"/><g font-family="Archivo, sans-serif"><text x="28" y="50" font-size="32" font-weight="300" fill="#171a24" data-max-width="584">Search</text><rect x="28" y="80" width="584" height="68" rx="28" fill="#ffffff" stroke="#bcc7e6"/><g fill="none" stroke="#202d92" stroke-width="2" stroke-linecap="round"><circle cx="57" cy="111" r="8"/><path d="m63 117 6 6"/></g><text x="84" y="124" font-size="28" font-weight="400" fill="#171a24" data-max-width="470">AI readiness checker</text><path d="M28 182h584" stroke="#d2d6e0"/><g transform="translate(28 203) scale(0.22)"><path d="M128.272 32.916A76.5 76.5 0 1 0 171.584 77.018" fill="none" stroke="#202d92" stroke-width="10.5" stroke-linecap="round"/><path d="M81 122 156 38 165 48.5Z" fill="#202d92"/><circle cx="166.5" cy="36.8" r="12" fill="#202d92"/></g><text x="88" y="231" font-size="32" font-weight="450" fill="#202d92" data-max-width="460">Structly</text><text x="88" y="267" font-size="26" font-weight="400" fill="#171a24" data-max-width="510">A page-level AI readiness checker</text><path d="M583 212h17v17m0-17-23 23" fill="none" stroke="#202d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="326" font-size="28" font-weight="400" fill="#171a24" data-max-width="584">Inspect metadata, headings and</text><text x="28" y="362" font-size="28" font-weight="400" fill="#171a24" data-max-width="584">accessibility. Get specific fixes.</text><text x="28" y="418" font-size="20" font-weight="400" fill="#626879" data-max-width="584">Illustrative example</text></g></svg>