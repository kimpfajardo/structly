<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title description"><title id="title">Illustrative answer with a Structly citation</title><desc id="description">An original, unbranded answer interface explains initial HTML, headings, metadata and labeled controls, with Structly as an illustrative source citation. This is not an actual AI response or citation.</desc><rect width="640" height="440" rx="18" fill="#f6f7f9"/><g font-family="Archivo, sans-serif"><text x="28" y="50" font-size="32" font-weight="300" fill="#171a24" data-max-width="584">Answers</text><text x="28" y="109" font-size="32" font-weight="400" fill="#171a24" data-max-width="584">How can I check a page’s</text><text x="28" y="149" font-size="32" font-weight="400" fill="#171a24" data-max-width="584">AI readiness?</text><rect x="20" y="178" width="600" height="210" rx="20" fill="#202d92"/><text x="44" y="220" font-size="26" font-weight="400" fill="#ffffff" data-max-width="552">Read the initial HTML, headings,</text><text x="44" y="254" font-size="26" font-weight="400" fill="#ffffff" data-max-width="552">metadata and labeled controls.</text><text x="44" y="288" font-size="26" font-weight="400" fill="#ffffff" data-max-width="552">Structly checks those page signals.</text><path d="M44 313h552" stroke="#ffffff" stroke-opacity=".25"/><g transform="translate(44 333) scale(0.15)"><path d="M128.272 32.916A76.5 76.5 0 1 0 171.584 77.018" fill="none" stroke="#ffffff" stroke-width="10.5" stroke-linecap="round"/><path d="M81 122 156 38 165 48.5Z" fill="#ffffff"/><circle cx="166.5" cy="36.8" r="12" fill="#ffffff"/></g><text x="87" y="358" font-size="26" font-weight="450" fill="#ffffff" data-max-width="452">Structly</text><path d="M577 339h15v15m0-15-21 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="418" font-size="20" font-weight="400" fill="#626879" data-max-width="584">Illustrative example</text></g></svg>